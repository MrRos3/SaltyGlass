name: Publish SaltyGlass Fixed
on:
  push:
    paths:
      - "diag/FIXED_READY"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verified build block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/publish-simple.yml').read_text().splitlines()
          start = lines.index('      - name: Build and verify')
          run = None
          for i in range(start, len(lines)):
              if lines[i] == '        run: |':
                  run = i + 1
                  break
          if run is None:
              raise SystemExit('Build block not found')
          out = []
          for line in lines[run:]:
              if line.startswith('          '):
                  out.append(line[10:])
              elif line == '':
                  out.append('')
              else:
                  break
          script = '\n'.join(out) + '\n'
          script = script.replace("if len(vendor) < 1000 or 'globe' not in vendor or 'home' not in vendor:", "if len(vendor) < 1000 or 'globe' not in vendor:")
          Path('/tmp/salty-build.sh').write_text(script)
          PY
          bash /tmp/salty-build.sh
      - name: Commit published files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add -A
          git commit -m "Publish clean original SaltyGlass feature pack"
          git push
