name: Publish Original SaltyGlass Clean Build

on:
  push:
    paths:
      - "publish_payload/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct feature pack
        shell: bash
        run: |
          set -euo pipefail
          base64 -d publish_payload/feature-pack.lua.gz.b64 | gzip -dc > feature-pack.lua
          echo "cf9ed44a2f6e64da38b8a9263258a0199fd7442803e79c2e57ddc01a57aa53de  feature-pack.lua" | sha256sum -c -

      - name: Vendor full Lucide catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icons
          curl -fsSL "https://raw.githubusercontent.com/MrRos3/Icons/main/lucide/dist/Icons.lua" -o icons/Lucide.lua
          test -s icons/Lucide.lua

      - name: Build clean original-only repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('.')
          icons_path = root / 'icons' / 'Lucide.lua'
          icons_text = icons_path.read_text(encoding='utf-8')
          vendor_entries = dict(re.findall(r'\["([^"]+)"\]\s*=\s*"(rbxassetid://\d+)"', icons_text))
          vendor_count = len(vendor_entries)
          if vendor_count < 1000:
              raise SystemExit(f'Lucide catalog unexpectedly small: {vendor_count}')
          if 'home' not in vendor_entries or 'globe' not in vendor_entries:
              raise SystemExit('Lucide catalog missing core home/globe icons')

          original = (root / 'latest.lua').read_text(encoding='utf-8')
          original = original.replace('SaltyGlass v3.6.2 RC', 'SaltyGlass v3.6.3 RC', 1)

          start = original.find('local LUCIDE_IMAGES = {')
          marker = '\n\nlocal function renderLucideIcon'
          end = original.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate original Lucide table')

          legacy_block = original[start:end]
          legacy_entries = dict(re.findall(r'\["([^"]+)"\]\s*=\s*"(rbxassetid://\d+)"', legacy_block))
          merged = dict(vendor_entries)
          for name, asset in legacy_entries.items():
              merged.setdefault(name, asset)

          catalog_lines = ['local LUCIDE_IMAGES = {']
          for name in sorted(merged):
              catalog_lines.append(f'    ["{name}"] = "{merged[name]}",')
          catalog_lines.append('}')
          catalog = '\n'.join(catalog_lines)
          original = original[:start] + catalog + original[end:]

          parent_line = 'screenGui.Parent = playerGui\n'
          attr_block = (
              'screenGui.Parent = playerGui\n'
              'screenGui:SetAttribute("UISoundsEnabled", premiumFx.uiSoundsEnabled)\n'
              f'screenGui:SetAttribute("LucideCatalogCount", {len(merged)})\n'
              'screenGui:SetAttribute("LucideCatalogSource", "icons/Lucide.lua")\n'
          )
          if 'screenGui:SetAttribute("UISoundsEnabled"' not in original:
              original = original.replace(parent_line, attr_block, 1)

          sounds_line = 'function premiumFx.setUiSounds(enabled)\n    premiumFx.uiSoundsEnabled = enabled == true\n'
          sounds_replacement = (
              'function premiumFx.setUiSounds(enabled)\n'
              '    premiumFx.uiSoundsEnabled = enabled == true\n'
              '    if screenGui and screenGui.Parent then\n'
              '        screenGui:SetAttribute("UISoundsEnabled", premiumFx.uiSoundsEnabled)\n'
              '    end\n'
          )
          sound_start = original.find('function premiumFx.setUiSounds')
          sound_end = original.find('function premiumFx.setReduceMotion')
          sound_slice = original[sound_start:sound_end]
          if 'screenGui:SetAttribute("UISoundsEnabled", premiumFx.uiSoundsEnabled)' not in sound_slice:
              if sounds_line not in original:
                  raise SystemExit('Could not patch UI sound state')
              original = original.replace(sounds_line, sounds_replacement, 1)

          (root / 'latest.lua').write_text(original, encoding='utf-8')
          (root / 'src').mkdir(exist_ok=True)
          (root / 'src' / 'SaltyGlass.client.lua').write_text(original, encoding='utf-8')
          (root / 'releases').mkdir(exist_ok=True)
          (root / 'releases' / 'v3.6.3.lua').write_text(original, encoding='utf-8')

          indented = ''.join('    ' + line if line.strip() else line for line in original.splitlines(True))
          module = (
              'local SaltyGlass = { Version = "3.6.3 RC" }\n\n'
              'function SaltyGlass.Start()\n'
              + indented +
              '    return screenGui\n'
              'end\n\n'
              'return SaltyGlass\n'
          )
          (root / 'src' / 'SaltyGlassModule.lua').write_text(module, encoding='utf-8')

          feature = (root / 'feature-pack.lua').read_text(encoding='utf-8')
          (root / 'releases' / 'feature-pack-v1.0.0.lua').write_text(feature, encoding='utf-8')

          for rel in [
              'library.lua',
              'src/SaltyGlassLibrary.lua',
              'releases/library-v1.0.0.lua',
              'releases/library-v1.1.0.lua',
          ]:
              p = root / rel
              if p.exists():
                  p.unlink()

          examples = root / 'examples'
          examples.mkdir(exist_ok=True)
          for p in examples.iterdir():
              if p.is_file():
                  p.unlink()
          (examples / 'Original.lua').write_text(
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/latest.lua"))()\n',
              encoding='utf-8'
          )
          (examples / 'FeaturePack.lua').write_text(
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/feature-pack.lua"))()\n',
              encoding='utf-8'
          )
          (examples / 'PinnedOriginal.lua').write_text(
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/releases/v3.6.3.lua"))()\n',
              encoding='utf-8'
          )
          (examples / 'StudioModule.client.lua').write_text(
              'local module = script.Parent:WaitForChild("SaltyGlassModule")\nlocal SaltyGlass = require(module)\nSaltyGlass.Start()\n',
              encoding='utf-8'
          )

          (root / 'loader.lua').write_text(
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/latest.lua"))()\n',
              encoding='utf-8'
          )
          (root / 'showcase.lua').write_text(
              'loadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/feature-pack.lua"))()\n',
              encoding='utf-8'
          )
          (root / 'VERSION').write_text('3.6.3 RC\n', encoding='utf-8')

          icon_sha256 = hashlib.sha256(icons_path.read_bytes()).hexdigest()
          manifest = {
              'name': 'SaltyGlass',
              'owner': 'MrRos3',
              'version': '3.6.3 RC',
              'feature_pack_version': '1.0.0',
              'stable_raw': 'https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/latest.lua',
              'feature_pack_raw': 'https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/feature-pack.lua',
              'pinned_raw': 'https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/releases/v3.6.3.lua',
              'feature_pack_pinned_raw': 'https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/releases/feature-pack-v1.0.0.lua',
              'lucide': {
                  'catalog': 'icons/Lucide.lua',
                  'source': 'MrRos3/Icons/lucide/dist/Icons.lua',
                  'vendor_count': vendor_count,
                  'renderer_count': len(merged),
                  'sha256': icon_sha256,
              },
              'entrypoints': {
                  'original': 'latest.lua',
                  'feature_pack': 'feature-pack.lua',
                  'showcase': 'showcase.lua',
                  'studio_local_script': 'src/SaltyGlass.client.lua',
                  'studio_module': 'src/SaltyGlassModule.lua',
              },
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          (root / 'icons' / 'README.md').write_text(
              '# Lucide icon catalog\n\n'
              f'`Lucide.lua` contains **{vendor_count}** Roblox ImageLabel asset mappings from the generated source catalog.\n\n'
              f'The SaltyGlass renderer exposes **{len(merged)}** names after preserving any legacy Salty aliases that are not present in the current catalog.\n\n'
              'Source: `MrRos3/Icons/lucide/dist/Icons.lua`.\n\n'
              f'SHA-256: `{icon_sha256}`\n',
              encoding='utf-8'
          )

          readme = f'''# SaltyGlass\n\nSaltyGlass is the original glass-style Roblox client UI by **MrRos3**. The repository now keeps one visual direction only: the finished original SaltyGlass look.\n\n## Run the original GUI\n\n```lua\nloadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/latest.lua"))()\n```\n\n## Run the original-looking feature pack\n\n```lua\nloadstring(game:HttpGet("https://raw.githubusercontent.com/MrRos3/SaltyGlass/main/feature-pack.lua"))()\n```\n\nThe feature pack loads the original GUI first and then adds Player, World, and Utility controls without replacing its visual design. The World tab uses the original tab chrome and the same UI click/hover sound assets as the rest of SaltyGlass.\n\n### Feature pack\n\nPlayer controls include movement override, WalkSpeed, jump strength, hold-Shift sprint, sprint speed, camera FOV, max camera zoom, mouse sensitivity, camera height offset, and reset. World controls include fullbright, fog, shadows, time of day, brightness, exposure, saturation, contrast, bloom, bloom intensity, sun rays, and reset. Utility controls include crosshair options plus an FPS/ping/session overlay.\n\n## Lucide icons\n\nThe original icon renderer now uses the full vendored Lucide catalog: **{vendor_count} generated icon assets**, with **{len(merged)} renderer names** after legacy Salty aliases are preserved. Any catalog key can be passed to the original renderer. The feature pack uses the catalog's `globe` asset for the World tab.\n\nThe standalone catalog is `icons/Lucide.lua`.\n\n## Repository layout\n\n- `latest.lua` — clean original SaltyGlass v3.6.3 RC.\n- `feature-pack.lua` — original GUI plus the expanded feature set.\n- `showcase.lua` — one-line feature-pack launcher.\n- `icons/Lucide.lua` — complete Roblox Lucide asset table.\n- `src/SaltyGlass.client.lua` — Studio LocalScript source.\n- `src/SaltyGlassModule.lua` — Studio ModuleScript wrapper.\n- `releases/v3.6.3.lua` — pinned original release.\n- `releases/feature-pack-v1.0.0.lua` — pinned feature-pack release.\n\n`HttpGet` + `loadstring` requires a compatible client environment. For normal Roblox Studio projects, use the sources under `src/`.\n'''
          (root / 'README.md').write_text(readme, encoding='utf-8')

          old_changelog = (root / 'CHANGELOG.md').read_text(encoding='utf-8') if (root / 'CHANGELOG.md').exists() else '# Changelog\n'
          if old_changelog.startswith('# Changelog'):
              old_changelog = old_changelog[len('# Changelog'):].lstrip('\n')
          changelog = f'''# Changelog\n\n## 3.6.3 RC / Feature Pack 1.0.0\n\n- Kept the finished original SaltyGlass visual design as the only GUI style in the repository.\n- Vendored all {vendor_count} generated Lucide Roblox asset mappings and connected the original icon renderer to the complete catalog while preserving legacy aliases.\n- Added `feature-pack.lua` with Player, World, and Utility features while preserving the original UI.\n- Added a fifth original-style World tab with the Lucide `globe` icon.\n- Fixed click/hover UI sounds for the World tab and injected controls; they follow the original UI Sounds toggle.\n- Removed the old generic/recreated `library.lua` GUI and its library examples/releases.\n- Added pinned original and feature-pack releases.\n\n''' + old_changelog
          (root / 'CHANGELOG.md').write_text(changelog, encoding='utf-8')
          PY

      - name: Compile with official Luau
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.734/luau-ubuntu.zip" -o /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          /tmp/luau/luau-compile latest.lua >/dev/null
          /tmp/luau/luau-compile feature-pack.lua >/dev/null
          /tmp/luau/luau-compile icons/Lucide.lua >/dev/null
          /tmp/luau/luau-compile src/SaltyGlassModule.lua >/dev/null

      - name: Final integrity
        shell: bash
        run: |
          set -euo pipefail
          test ! -e library.lua
          test ! -e src/SaltyGlassLibrary.lua
          test -s icons/Lucide.lua
          grep -q 'UISoundsEnabled' latest.lua
          grep -q 'playInjectedClick' feature-pack.lua
          grep -q 'WorldTab' feature-pack.lua
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/workflows/*' \
            ! -path './publish_payload/*' \
            ! -path './diag/*' \
            ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Commit clean publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add -A
          git commit -m "Publish original SaltyGlass feature pack and full Lucide catalog"
          git push
