name: Publish SaltyGlass Future Framework
on:
  push:
    paths:
      - '.salty-future-payload.b64'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct publish bundle
        shell: bash
        run: |
          base64 -d .salty-future-payload.b64 > /tmp/salty-future.tgz
          tar -xzf /tmp/salty-future.tgz -C .
          test -s framework.lua
          test -s feature-pack.lua
          test -s key.lua
          test -s server/validator-worker.js
          grep -q 'Future Framework v1.0.0' framework.lua
          grep -q 'RGB + HEX' framework.lua
          grep -q 'RegisterFeature' framework.lua
          grep -q 'RegisterModule' framework.lua
          grep -q 'featureFlags' key.lua
          grep -q 'role:' server/validator-worker.js
      - name: Commit publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add future framework and RGB HEX picker'
          git push
