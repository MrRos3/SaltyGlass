name: Verify Showcase Compatibility

on:
  push:
    paths:
      - "verify_showcase/READY"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/luau-lang/luau/releases/download/0.734/luau-ubuntu.zip -o /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
      - name: Compile compatibility files
        shell: bash
        run: |
          set -euo pipefail
          /tmp/luau/luau-compile showcase.lua >/dev/null
          /tmp/luau/luau-compile examples/OriginalStyleShowcase.lua >/dev/null
          /tmp/luau/luau-compile examples/LibraryExample.lua >/dev/null
      - name: Mark verification passed
        shell: bash
        run: |
          set -euo pipefail
          printf 'verified\n' > verify_showcase/PASSED
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify_showcase/PASSED
          git commit -m "Mark showcase compile verification passed"
          git push
