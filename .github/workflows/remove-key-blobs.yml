name: Remove Key Blobs
on:
  push:
    paths:
      - '.github/workflows/remove-key-blobs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove blobs
        shell: python
        run: |
          from pathlib import Path
          p = Path('key-system.lua')
          text = p.read_text(encoding='utf-8')
          start = text.find('    local ambientA=Instance.new("Frame")')
          end = text.find('    local sweep=Instance.new("Frame")')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('ambient blob block not found')
          text = text[:start] + text[end:]
          text = text.replace('Version="1.1.0"', 'Version="1.1.1"', 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add key-system.lua
          git commit -m 'Remove decorative blobs from key system'
          git push
