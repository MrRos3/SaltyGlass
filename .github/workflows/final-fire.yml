name: Salty Final Trigger Check
on:
  push:
    paths:
      - "diag/FINAL_READY"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo fired > diag/FINAL_FIRED
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add diag/FINAL_FIRED
          git commit -m "Verify final SaltyGlass trigger"
          git push
