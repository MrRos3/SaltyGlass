name: Publish SaltyGlass Library

on:
  push:
    paths:
      - "bootstrap/READY-LIBRARY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild prepared library package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/minpart* | base64 --decode > /tmp/salty-library.tar.xz
          rm -rf /tmp/salty-library
          mkdir -p /tmp/salty-library
          tar -xJf /tmp/salty-library.tar.xz -C /tmp/salty-library
          test -f /tmp/salty-library/SaltyGlass/library.lua
          cp -a /tmp/salty-library/SaltyGlass/. .
          mkdir -p releases src examples
          cp library.lua releases/library-v1.0.0.lua
          cp library.lua src/SaltyGlassLibrary.lua

      - name: Verify exact source integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "750897738afec96d57ce33099c28011716d02e9fbd5ed13030fc717b6676b442  library.lua" | sha256sum -c -
          cmp -s library.lua releases/library-v1.0.0.lua
          cmp -s library.lua src/SaltyGlassLibrary.lua
          grep -Fq 'SaltyGlass UI Library v1.0.0' library.lua
          grep -Fq 'return SaltyGlass' library.lua
          grep -Fq '/main/library.lua' examples/LibraryExample.lua

      - name: Compile with official Luau
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.734/luau-ubuntu.zip
          rm -rf /tmp/luau
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile
          /tmp/luau/luau-compile library.lua >/dev/null
          /tmp/luau/luau-compile examples/LibraryExample.lua >/dev/null
          /tmp/luau/luau-compile examples/StudioLibrary.client.lua >/dev/null

      - name: Regenerate checksums and clean bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/publish-library.yml
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name 'SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Publish Library v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SaltyGlass reusable UI library v1.0.0"
          git push
