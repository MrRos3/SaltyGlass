name: Debug Exact Salty Build Block
on:
  push:
    paths:
      - "diag/SIMPLE_DEBUG_READY"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and run exact build block
        shell: bash
        run: |
          set +e
          mkdir -p diag
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/publish-simple.yml')
          lines=p.read_text().splitlines()
          start=None
          for i,line in enumerate(lines):
              if line == '      - name: Build and verify':
                  start=i
                  break
          if start is None: raise SystemExit('build step not found')
          run=None
          for i in range(start,len(lines)):
              if lines[i] == '        run: |':
                  run=i+1
                  break
          if run is None: raise SystemExit('run block not found')
          out=[]
          for line in lines[run:]:
              if line.startswith('          '):
                  out.append(line[10:])
              elif line == '':
                  out.append('')
              else:
                  break
          Path('/tmp/exact-build.sh').write_text('\n'.join(out)+'\n')
          print('extracted_lines',len(out))
          PY
          bash -x /tmp/exact-build.sh > diag/simple-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> diag/simple-build.log
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add diag/simple-build.log
          git commit -m "Record exact SaltyGlass build failure"
          git push
          exit 0
